spring.main.allow-circular-references=true

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expensetracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.port=${PORT:8080}

app.jwtSecret=${JWT_SECRET: ======================expense=tracker=mywallet===========================}
app.jwtExpirationMs=86400000

# Comma-separated list of frontend origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Email (Gmail SMTP: use an App Password, not your normal password)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:YOUR_USERNAME}
spring.mail.password=${MAIL_PASSWORD:YOUR_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# true = skip email OTP on sign-up (handy for demos / if SMTP isn't configured)
app.auth.skipEmailVerification=${SKIP_EMAIL_VERIFICATION:false}

# Default categories + admin user created on first start
app.seed.categories=${SEED_CATEGORIES:true}
app.seed.admin.enabled=${SEED_ADMIN:true}
app.seed.admin.username=${ADMIN_USERNAME:admin}
app.seed.admin.email=${ADMIN_EMAIL:admin@example.com}
app.seed.admin.password=${ADMIN_PASSWORD:Admin@123}

app.verificationCodeExpirationMs=${VERIFICATION_EXPIRY_MS:900000}

app.user.profile.upload.dir=${UPLOAD_DIR:./uploads/user/profile}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
